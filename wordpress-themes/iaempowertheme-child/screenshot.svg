<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradiente de fondo: púrpura -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo gradiente -->
  <rect width="1200" height="900" fill="url(#bgGradient)"/>

  <!-- Patrón de líneas decorativas -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="0" y1="0" x2="600" y2="900"/>
    <line x1="100" y1="0" x2="700" y2="900"/>
    <line x1="200" y1="0" x2="800" y2="900"/>
    <line x1="300" y1="0" x2="900" y2="900"/>
    <line x1="400" y1="0" x2="1000" y2="900"/>
    <line x1="500" y1="0" x2="1100" y2="900"/>
    <line x1="600" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- Panel blanco semi-transparente para contenido -->
  <rect x="0" y="150" width="1200" height="550" fill="white" opacity="0.95"/>

  <!-- Línea divisoria superior -->
  <rect x="50" y="150" width="1100" height="5" fill="url(#accentGradient)"/>

  <!-- Título principal -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    IAEMPOWER
  </text>

  <!-- Subtítulo con énfasis en Child Theme -->
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="56" text-anchor="middle" fill="#667eea" font-weight="700">
    Child Theme
  </text>

  <!-- Descripción -->
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#666666" font-weight="400">
    + Custom Post Type Servicios
  </text>

  <!-- Características - Fila 1 -->
  <circle cx="120" cy="430" r="8" fill="#37b24d"/>
  <text x="160" y="440" font-family="Arial, sans-serif" font-size="28" fill="#333333">
    Hereda del tema padre automáticamente
  </text>

  <!-- Características - Fila 2 -->
  <circle cx="120" cy="510" r="8" fill="#37b24d"/>
  <text x="160" y="520" font-family="Arial, sans-serif" font-size="28" fill="#333333">
    Servicios con URLs propias (/servicios/...)
  </text>

  <!-- Características - Fila 3 -->
  <circle cx="120" cy="590" r="8" fill="#37b24d"/>
  <text x="160" y="600" font-family="Arial, sans-serif" font-size="28" fill="#333333">
    Menú dinámico que crece automáticamente
  </text>

  <!-- Características - Fila 4 -->
  <circle cx="120" cy="670" r="8" fill="#37b24d"/>
  <text x="160" y="680" font-family="Arial, sans-serif" font-size="28" fill="#333333">
    Protegido de actualizaciones del padre
  </text>

  <!-- Badge inferior -->
  <text x="600" y="800" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#764ba2" font-weight="500">
    Compatible con IAEMPOWER 1.12.3+
  </text>

  <!-- Versión -->
  <text x="600" y="850" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#999999">
    Versión 1.0.0 | Octubre 2026
  </text>
</svg>
